name: Windows offline checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check syntax
        run: python -m compileall -q main.py vrmmon tools tests
      - name: Test shared-memory parsing and sensor classification
        run: python tests/test_hwinfo_parse.py
